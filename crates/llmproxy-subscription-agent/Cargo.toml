[package]
name = "llmproxy-subscription-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
llmproxy-core = { path = "../llmproxy-core" }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "stream"] }
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.11.1"
futures-util = "0.3.34"
tokio-util = { version = "0.7.19", features = ["rt"] }
base64 = "0.23.1"
sha2 = "0.11.0"
ring = "0.17.14"
url = "2.5.8"
