[package]
name = "llmproxy-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.0", features = ["metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.0"

[dev-dependencies]
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
prost = "0.14.4"
