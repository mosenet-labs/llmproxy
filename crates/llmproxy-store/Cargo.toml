[package]
name = "llmproxy-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.23.1"
llmproxy-core = { path = "../llmproxy-core" }
toasty = { version = "0.10.0", default-features = false, features = ["postgresql", "sqlite", "migration"] }
toasty-core = "0.10.0"
toasty-driver-sqlite = "0.10.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
