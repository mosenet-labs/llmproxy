[package]
name = "llmproxy-gateway"
default-run = "llmproxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "llmproxy"
path = "src/main.rs"

[dependencies]
llmproxy-core = { path = "../llmproxy-core" }
llmproxy-store = { path = "../llmproxy-store" }
llmproxy-console = { path = "../llmproxy-console" }
http-body-util = "0.1.3"
hyper = { version = "1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
pingora = { version = "0.9.0", features = ["proxy", "rustls"] }
pingora-http = "0.9.0"
async-trait = "0.1.92"
serde.workspace = true
serde_json.workspace = true
bytes = "1.11.1"
percent-encoding = "2.3.2"
tracing.workspace = true
llmproxy-telemetry = { path = "../llmproxy-telemetry" }
dotenvy = "0.15.7"
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", features = ["metrics", "trace"] }
getrandom = "0.4.3"
sha2 = "0.11.0"
base64 = "0.23.1"
tokio-util = {version="0.7.19",features=["rt"]}

[dev-dependencies]
llmproxy-probe = { path = "../llmproxy-probe" }
opentelemetry-appender-tracing = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde_json.workspace = true
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
toasty = { version = "0.11.0", default-features = false, features = ["postgresql"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form"] }
url = "2.5.8"

tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
