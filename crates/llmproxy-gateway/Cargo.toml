[package]
name = "llmproxy-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "llmproxy"
path = "src/main.rs"

[dependencies]
llmproxy-core = { path = "../llmproxy-core" }
llmproxy-store = { path = "../llmproxy-store" }
llmproxy-console = { path = "../llmproxy-console" }
http-body-util = "0.1.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
pingora = { version = "0.9.0", features = ["proxy", "rustls"] }
pingora-http = "0.9.0"
async-trait = "0.1.92"
serde.workspace = true
toml = "1.1.6"
tracing.workspace = true
llmproxy-telemetry = { path = "../llmproxy-telemetry" }
dotenvy = "0.15.7"
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", features = ["metrics", "trace"] }

[dev-dependencies]
opentelemetry-appender-tracing = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde_json.workspace = true
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
base64 = "0.23.1"
toasty = { version = "0.10.0", default-features = false, features = ["postgresql"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form"] }
url = "2.5.8"
