[package]
name = "llmproxy-console"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
llmproxy-core = { path = "../llmproxy-core" }
llmproxy-store = { path = "../llmproxy-store" }
tracing.workspace = true
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", features = ["metrics", "trace"] }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
getrandom = "0.4.3"
topcoat = { version = "0.9.0", default-features = false, features = ["asset", "icon", "router", "runtime", "view"] }
topcoat-ant-design = { version = "0.2.0", path = "../../../topcoat-ant-design", features = ["router"] }
url = "2.5.8"

[build-dependencies]
sha2 = "0.11.0"
topcoat = { version = "0.9.0", default-features = false, features = ["tailwind"] }
topcoat-asset = "0.9.0"
topcoat-runtime = "0.9.0"
