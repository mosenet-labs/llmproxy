[package]
name = "llmproxy-console"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
llmproxy-core = { path = "../llmproxy-core" }
llmproxy-store = { path = "../llmproxy-store" }
llmproxy-probe = { path = "../llmproxy-probe" }
tracing.workspace = true
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", features = ["metrics", "trace"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.23.1"
rust_decimal = "1.43.0"
chrono = "0.4.45"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
getrandom = "0.4.3"
tokio = { version = "1.53.1", features = ["sync", "rt", "time", "macros"] }
topcoat = { version = "0.10.0", default-features = false, features = ["asset", "discover", "icon", "router", "runtime", "view"] }
topcoat-ant-design = { version = "0.3.0", features = ["router"] }
url = "2.5.8"
percent-encoding = "2.3.2"

[build-dependencies]
sha2 = "0.11.0"
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }
topcoat-asset = "0.10.0"
topcoat-runtime = "0.10.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
