[workspace]
members = [
    "crates/llmproxy-core",
    "crates/llmproxy-store",
    "crates/llmproxy-gateway",
    "crates/llmproxy-console",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
